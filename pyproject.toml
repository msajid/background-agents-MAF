[project]
name = "background-agents-maf"
version = "0.1.0"
description = "Beginner-friendly Microsoft Agent Framework background agents demo"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
keywords = ["ai-agents", "background-agents", "microsoft-agent-framework", "multi-agent"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "agent-framework-foundry>=1.14.0,<2",
    "azure-identity>=1.25,<2",
    "python-dotenv>=1,<2",
]

[dependency-groups]
dev = [
    "ipykernel>=7,<8",
    "ipywidgets>=8,<9",
    "pytest>=9,<10",
    "pytest-mock>=3,<4",
    "ruff>=0.14,<1",
    "tqdm>=4,<5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
